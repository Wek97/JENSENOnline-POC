<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="admin.css" />
    <script type="module" src="admin.js" defer></script>
    <title>JENSENOnline | Admin</title>
  </head>
  <body>
    <header></header>
    <main class="container">
      <h1 id="form-title">Lägg till produkt</h1>
      <form>
        <input type="hidden" name="id" id="id" />
        <div class="form-controls">
          <input required maxlength="100" type="text" name="name" id="name" />
          <label for="name">Produktnamn</label>
        </div>
        <div class="form-controls">
          <input
            maxlength="500"
            type="text"
            name="description"
            id="description"
          />
          <label for="description">Beskrivning</label>
        </div>
        <div class="form-controls">
          <input
            required
            maxlength="50"
            type="text"
            name="category"
            id="category"
          />
          <label for="category">Kategori</label>
        </div>
        <div class="form-controls">
          <input
            required
            min="1"
            max="1000000"
            step="0.01"
            type="number"
            name="price"
            id="price"
          />
          <label for="price">Pris</label>
        </div>
        <button class="btn btn-rounded">Spara produkt</button>
        <p id="message"></p>
      </form>
      <section id="admin-products"></section>
    </main>
  </body>
</html>
