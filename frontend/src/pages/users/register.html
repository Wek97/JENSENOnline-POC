<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="users.css" />
    <script type="module" src="users.js" defer></script>
    <title>JENSENOnline | Skapa konto</title>
  </head>
  <body>
    <header></header>
    <main class="container">
      <h1>Skapa konto</h1>
      <form>
        <div class="form-controls">
          <input required type="email" name="email" id="email" />
          <label for="email">E-post</label>
        </div>
        <div class="form-controls">
          <input
            required
            minlength="8"
            type="password"
            name="password"
            id="password"
          />
          <label for="password">Lösenord (minst 8 tecken)</label>
        </div>
        <button class="btn btn-rounded">Registrera</button>
        <p id="message"></p>
      </form>
    </main>
  </body>
</html>
